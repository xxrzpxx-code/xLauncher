name: Release xLauncher
# Uruchom: wpisz w package.json nowa wersje, zrob commit, potem:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ustaw repozytorium do aktualizacji
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const [o,r]=process.env.GITHUB_REPOSITORY.split('/');p.build.publish={provider:'github',owner:o,repo:r,releaseType:'release'};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Instalacja zaleznosci
        run: npm install
      - name: Budowanie i publikacja (exe, instalator, latest.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
